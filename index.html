<style>
:root{--blue:#168bff;--pink:#f329a8;--yellow:#ffd83d;--white:#fff;--ink:#24304a;--bg:#eef7ff;--card:#fff;--muted:#64748b;--shadow:0 12px 30px #17416b1c}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#e8f5ff,#fff4fb);color:var(--ink);min-height:100vh}
body.dark{--bg:#111827;--card:#1f2937;--ink:#f8fafc;--muted:#cbd5e1;background:linear-gradient(145deg,#101c32,#30152c)}
button{font:inherit;cursor:pointer;border:0;border-radius:17px;padding:12px 15px;font-weight:800;transition:transform .12s}button:active{transform:scale(.97)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px max(12px,calc((100vw - 900px)/2));background:var(--blue);color:white;position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.brand{font-weight:1000;font-size:1.08rem}.tools{display:flex;gap:7px}.tools button{background:#fff;color:#1267bf;padding:9px 12px}
main{max-width:900px;margin:auto;padding:16px}
.hero{background:linear-gradient(125deg,#168bff,#5ab5ff 58%,#f329a8);color:#fff;border-radius:28px;padding:22px;display:grid;grid-template-columns:130px 1fr;align-items:center;gap:18px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.portrait{width:130px;height:130px;object-fit:cover;object-position:center 28%;border:5px solid #fff;border-radius:30px;box-shadow:0 8px 22px #002e6c55}
h1{margin:0 0 6px;font-size:clamp(1.35rem,4vw,2.1rem)}.hero p{margin:6px 0 14px;font-size:1.05rem}.primary{background:var(--yellow);color:#553d00;padding:13px 22px;box-shadow:0 5px 0 #d8a900}
.section-title{font-size:1.25rem;margin:23px 3px 12px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:var(--card);color:var(--ink);text-align:right;min-height:120px;padding:16px;border:2px solid transparent;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}.tile:hover{border-color:var(--pink)}.emoji{font-size:2rem}.tile small{color:var(--muted);font-weight:600}
.panel{margin-top:16px;background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.hidden{display:none!important}.choices{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.choice{background:#e7f3ff;color:#12549b;min-width:75px}.choice.pink{background:#ffe0f3;color:#a30d68}.choice.yellow{background:#fff3b7;color:#664c00}.big-emoji{font-size:4rem;text-align:center;margin:10px}.feedback{font-weight:900;min-height:28px;color:#0b9b68}.muted{color:var(--muted)}.back{background:#e7eff8;color:#29415d;margin-bottom:12px}.progress{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--pink);width:0;transition:width .2s}.animal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.animal{background:var(--card);border:2px solid #e4effa;border-radius:18px;padding:14px;text-align:center;color:var(--ink)}.animal .emoji{display:block}.animal strong{display:block}.animal small{display:block;color:var(--muted);margin:4px}
footer{text-align:center;padding:25px 12px;color:var(--muted);font-size:.85rem}
@media(max-width:520px){.hero{grid-template-columns:88px 1fr;padding:16px;gap:12px}.portrait{width:88px;height:104px;border-radius:22px}.hero p{font-size:.95rem}.tiles{gap:9px}.tile{padding:13px;min-height:112px}.tools button{font-size:.85rem;padding:8px 10px}}
</style></head>

      audioCtx = audioCtx || new AC();

      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(e => {
          audioStatus(
            'تعذر تشغيل الصوت: ' + e.message,
            'Could not start audio: ' + e.message
          );
        });
      }
    }

    if ('speechSynthesis' in window) {
      speechSynthesis.getVoices();
    }
  } catch (e) {
    audioStatus(
      'خطأ في تهيئة الصوت: ' + e.message,
      'Audio setup error: ' + e.message
    );
  }
}

function beep(freq = 660, dur = 0.2) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;

    if (!AC) {
      audioStatus(
        'المتصفح لا يدعم النغمة التجريبية. جرب Chrome.',
        'Browser does not support the test tone. Try Chrome.'
      );
      return false;
    }

    audioCtx = audioCtx || new AC();

    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(e => {
        audioStatus(
          'تعذر استئناف الصوت: ' + e.message,
          'Could not resume audio: ' + e.message
        );
      });
    }

    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    o.type = 'sine';
    o.frequency.value = freq;

    g.gain.setValueAtTime(0.001, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.03);
    g.gain.exponentialRampToValueAtTime(
      0.001,
      audioCtx.currentTime + dur
    );

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();
    o.stop(audioCtx.currentTime + dur + 0.03);

    return true;
  } catch (e) {
    audioStatus(
      'خطأ صوتي: ' + (e.message || e),
      'Audio error: ' + (e.message || e)
    );
    return false;
  }
}

function speak(text) {
  unlockAudio();

  if (
    !('speechSynthesis' in window) ||
    !('SpeechSynthesisUtterance' in window)
  ) {
    audioStatus(
      'النغمة قد تعمل، لكن الكلام غير مدعوم في هذا المتصفح. جرب Chrome.',
      'Tone may work, but speech is unsupported. Try Chrome.'
    );
    beep(660, 0.2);
    return;
  }

  try {
    speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(String(text || ''));
    u.lang = lang === 'ar' ? 'ar-EG' : 'en-US';
    u.rate = 0.85;
    u.pitch = 1.1;
    u.volume = 1;

    const voices = speechSynthesis.getVoices();
    const preferred = lang === 'ar'
      ? voices.find(v => /^ar(-|_)/i.test(v.lang))
      : voices.find(v => /^en(-|_)(US|GB)/i.test(v.lang));

    if (preferred) u.voice = preferred;

    u.onstart = () => audioStatus(
      'بدأ تشغيل الكلام. هل تسمعينه؟',
      'Speech started. Can you hear it?'
    );

    u.onerror = e => audioStatus(
      'تعذر تشغيل الكلام: ' + (e.error || 'خطأ غير معروف'),
      'Speech failed: ' + (e.error || 'unknown error')
    );

    speechSynthesis.speak(u);
  } catch (e) {
    audioStatus(
      'خطأ في الكلام: ' + (e.message || e),
      'Speech error: ' + (e.message || e)
    );
  }
}

function renderCubes(c){c.innerHTML=`<h2>🧱 ${title('ورشة المكعبات والإبداع','Blocks & Creativity Workshop')}</h2><p>${title('اختاري قطعة ثم اضغطي على مساحة البناء لوضعها، أو اسحبي القطعة إليها. جرّبي بناء بيت أو برج أو سيارة خيالية.','Choose a piece then tap the build area to place it, or drag it there. Try a house, tower or imaginary car.')}</p><div class="choices" style="flex-wrap:wrap">${cubePieces.map((x,i)=>`<button class="choice" draggable="true" data-piece="${i}" onclick="selectCube(${i})" ondragstart="event.dataTransfer.setData('text/plain',String(${i}))" style="font-size:1.15rem">${x[0]}<small style="display:block">${x[1]}</small></button>`).join('')}</div><p id="cubeStatus" class="feedback">${title('اختاري قطعة ثم مساحة البناء.','Select a piece, then the build area.')}</p><div id="buildArea" aria-label="مساحة البناء" onclick="placeSelectedCube()" ondragover="event.preventDefault()" ondrop="event.preventDefault();placeCube(Number(event.dataTransfer.getData('text/plain')));" style="min-height:210px;background:linear-gradient(#e8f7ff,#fff);border:3px dashed #8abbe9;border-radius:20px;padding:12px;display:flex;flex-wrap:wrap;align-content:flex-end;align-items:flex-end;gap:8px"></div><div class="choices" style="margin-top:12px;flex-wrap:wrap"><button class="choice" onclick="saveBuild()">💾 ${title('حفظ الشكل','Save build')}</button><button class="choice" onclick="loadBuild()">📂 ${title('استعادة الشكل','Load build')}</button><button class="choice" onclick="clearBuild()">🔄 ${title('إعادة البناء','Rebuild')}</button><button class="choice" onclick="cubeChallenge()">⭐ ${title('تحدٍ بسيط','Easy challenge')}</button></div><p id="cubeChallengeText" class="feedback"></p><small class="muted">${title('الحفظ محلي على هذا الجهاز فقط.','Saved locally on this device only.')}</small>`;window.selectedCube=null;window.cubeBuild=[];}
function selectCube(i){window.selectedCube=i;const e=document.getElementById('cubeStatus');if(e)e.textContent=title('تم اختيار: ','Selected: ')+cubePieces[i][1]+' — '+title('اضغطي مساحة البناء.','tap the build area.')}
function placeSelectedCube(){if(window.selectedCube!==null&&window.selectedCube!==undefined)placeCube(window.selectedCube)}
function placeCube(i){if(!Number.isInteger(i)||!cubePieces[i])return;window.cubeBuild=window.cubeBuild||[];window.cubeBuild.push(i);const area=document.getElementById('buildArea');if(!area)return;const b=document.createElement('button');b.className='choice';b.textContent=cubePieces[i][0];b.title=cubePieces[i][1];b.style.fontSize='2rem';b.onclick=()=>{const idx=[...area.children].indexOf(b);if(idx>=0)window.cubeBuild.splice(idx,1);b.remove()};area.appendChild(b);const st=document.getElementById('cubeStatus');if(st)st.textContent=title('قطعة جميلة! يمكنك الضغط على القطعة لإزالتها.','Nice piece! Tap a piece to remove it.')}
function clearBuild(){window.cubeBuild=[];const a=document.getElementById('buildArea');if(a)a.replaceChildren();const s=document.getElementById('cubeStatus');if(s)s.textContent=title('مساحة جديدة! ابدئي من جديد.','Fresh space! Start again.')}
function saveBuild(){try{localStorage.setItem('celiaCubeBuild',JSON.stringify(window.cubeBuild||[]));const s=document.getElementById('cubeStatus');if(s)s.textContent=title('تم حفظ الشكل على هذا الجهاز.','Build saved on this device.')}catch(e){alert(title('تعذر الحفظ على هذا الجهاز.','Could not save on this device.'))}}
function loadBuild(){let a;try{a=JSON.parse(localStorage.getItem('celiaCubeBuild')||'[]')}catch(e){a=[]}clearBuild();a.forEach(placeCube);}
function cubeChallenge(){const tasks=[['ابني برجًا من 5 قطع.','Build a tower with 5 pieces.'],['استخدمي 3 ألوان مختلفة.','Use 3 different colors.'],['اصنعي بيتًا له باب ونافذة.','Build a house with a door and a window.'],['ابتكري شكلًا خياليًا.','Create an imaginary shape.']];const x=tasks[Math.floor(Math.random()*tasks.length)];const el=document.getElementById('cubeChallengeText');if(el)el.textContent=title('تحدي سيليا: ','Celia’s challenge: ')+title(x[0],x[1]);}

];
let matchLevel=0, matchBusy=false;
function renderMemory(c){memoryFirst=null;memoryMatches=0;matchBusy=false;window.matchSelections=[];window.matchFound=new Set();const level=matchingLevels[matchLevel];let left=level.pairs.map((p,i)=>({id:i,emoji:p.a,label:lang==='ar'?p.arA:p.enA,side:'L'})).sort(()=>Math.random()-.5);let right=level.pairs.map((p,i)=>({id:i,emoji:p.b,label:lang==='ar'?p.arB:p.enB,side:'R'})).sort(()=>Math.random()-.5);window.matchData={left,right};c.innerHTML=`<h2>${title('🧩 لعبة المطابقة الذكية','🧩 Smart Matching')}</h2><p>${title('اختاري مربعًا من العمود الأول ثم ما يرتبط به في العمود الثاني. في كل مستوى توجد ١٤ بطاقة: ٧ في كل عمود.','Choose one tile from each column. Every level has 14 tiles: 7 in each column.')}</p><div class="tile" style="min-height:auto;margin:10px 0"><strong>${lang==='ar'?level.nameAr:level.nameEn}</strong><small>${title('المستوى','Level')} ${matchLevel+1} / 3 · ${title('كل إجابة صحيحة تمنحك نجمة','Each correct match earns a star')}</small></div><div class="choices" style="align-items:flex-start;gap:12px"><div style="flex:1;min-width:0"><h3>${title('العمود الأول','Column 1')}</h3><div style="display:grid;grid-template-columns:1fr;gap:8px">${left.map((x,i)=>matchButton(x,i)).join('')}</div></div><div style="flex:1;min-width:0"><h3>${title('العمود الثاني','Column 2')}</h3><div style="display:grid;grid-template-columns:1fr;gap:8px">${right.map((x,i)=>matchButton(x,i)).join('')}</div></div></div><p id="memFeedback" class="feedback">${title('اختاري بطاقة من كل عمود وفكّري في العلاقة بينهما.','Choose one tile from each column and think about their relationship.')}</p><p>${title('الأزواج الصحيحة: ','Correct pairs: ')}<strong id="matchCount">0 / 7</strong></p><div class="choices"><button class="choice" onclick="renderMemory(document.getElementById('viewContent'))">🔄 ${title('إعادة المستوى','Restart level')}</button>${matchLevel>0?`<button class="choice" onclick="matchLevel--;renderMemory(document.getElementById('viewContent'))">⬅️ ${title('المستوى السابق','Previous level')}</button>`:''}</div>`}
function matchButton(x,i){return `<button class="animal" id="match${x.side}${i}" style="width:100%;min-height:76px" onclick="chooseMatch('${x.side}',${i})"><span class="emoji">${x.emoji}</span><strong>${x.label}</strong></button>`}
function chooseMatch(side,index){if(matchBusy)return;const arr=window.matchData[side==='L'?'left':'right'];const item=arr[index];if(window.matchFound.has(item.id))return;const btn=document.getElementById('match'+side+index);if(!btn)return;if(window.matchSelections.some(s=>s.side===side))return;btn.style.border='3px solid #8456c9';window.matchSelections.push({side,index,item});if(window.matchSelections.length<2)return;const [a,b]=window.matchSelections;const feedback=document.getElementById('memFeedback');if(a.side===b.side){window.matchSelections=[];return}if(a.item.id===b.item.id){window.matchFound.add(item.id);memoryMatches++;[a,b].forEach(s=>{const el=document.getElementById('match'+s.side+s.index);if(el){el.style.background='#d8f8df';el.style.border='3px solid #35bd78';el.disabled=true}});if(feedback)feedback.textContent=title('برافو يا سيليا! وجدتِ الزوج المناسب 🎉','Bravo, Celia! You found the right match 🎉');const count=document.getElementById('matchCount');if(count)count.textContent=memoryMatches+' / 7';addStar();window.matchSelections=[];if(memoryMatches===7){matchBusy=true;if(feedback)feedback.textContent=matchLevel<2?title('رائعة! أنهيتِ المستوى. هيا نرفع التحدي! 🌟','Amazing! Level complete. Let’s raise the challenge! 🌟'):title('بطلة يا سيليا! أكملتِ المستويات الثلاثة وكل الأزواج الـ٢١! 🏆','Champion Celia! You completed all 3 levels and all 21 pairs! 🏆');if(matchLevel<2){const next=document.createElement('button');next.className='primary';next.style.width='100%';next.style.marginTop='10px';next.textContent=title('ابدئي المستوى التالي ➜','Start next level ➜');next.onclick=()=>{matchLevel++;renderMemory(document.getElementById('viewContent'))};document.getElementById('viewContent').appendChild(next)}else addStar(5)}}else{if(feedback)feedback.textContent=title('قريب جدًا! فكّري: أين يعيش أو ماذا يحتاج؟ 💗','Almost! Think: where does it live, or what does it need? 💗');matchBusy=true;setTimeout(()=>{[a,b].forEach(s=>{const el=document.getElementById('match'+s.side+s.index);if(el&&!window.matchFound.has(s.item.id))el.style.border=''});window.matchSelections=[];matchBusy=false},850)}}
function renderSong(c){c.innerHTML=`<h2>${title('🎶 أغنية سيليا','🎶 Celia’s Song')}</h2><div class="big-emoji">🌈💗🎵</div><p style="white-space:pre-line;text-align:center;font-size:1.15rem;line-height:2">${title('يا سيليا يا نور العين 🌟\\nيا أحلى وردة بين البساتين 🌸\\nيلا نلعب، يلا نغني 🎵\\nوالعلم معانا يوم ورا يوم 💛','Celia, sunshine bright 🌟\\nLet’s learn and play with delight 🌸\\nColors, numbers, songs we sing 🎵\\nHappy smiles in everything 💛')}</p><p class="muted">${title('هذه كلمات أصلية تجريبية؛ لا يوجد تسجيل غنائي احترافي مرفق بعد. يمكن للمتصفح قراءة الكلمات بصوت آلي.','Original demo lyrics; no professional song recording is included yet. Your browser can read the words aloud.')}</p><button class="primary" onclick="speak(document.querySelector('#viewContent p').innerText)">${title('🔊 اسمعي الكلمات','🔊 Read the lyrics')}</button><button class="choice" onclick="toggleMusic()">${title('🎵 نغمات مرحة','🎵 Play cheerful tones')}</button>`}


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff70ad">
<title>سيليا احمد محمد زكى | Celia Ahmed MZ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#fff5fa;color:#382747;text-align:center}
header{background:linear-gradient(135deg,#ff70ad,#9b72ed);color:white;padding:24px 12px;border-radius:0 0 28px 28px}
h1{margin:8px 0;font-size:27px}
header p{margin:8px}
main{max-width:850px;margin:auto;padding:16px}
.panel{background:white;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 4px 15px #66336612}
h2{color:#8054be}
.menu,.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:16px;padding:15px 8px;font-size:17px;font-weight:bold;background:#f1e7ff;color:#533675}
.menu button{min-height:83px}
button:active{transform:scale(.97)}
.primary{background:#ff70ad;color:white}
#game{display:none}
#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.choice{background:#fff0f6;border:2px solid #f5d8e8;font-size:24px;min-height:90px}
.big{font-size:65px;margin:12px}
#feedback{min-height:35px;font-size:20px;font-weight:bold;color:#8054be}
.small{font-size:13px;color:#76667f}
@media(min-width:600px){.menu{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<div style="font-size:43px">🌸 🦋 🌸</div>
<h1>سيليا احمد محمد زكى</h1>
<p>Celia Ahmed MZ</p>
<p>نتعلّم ونلعب ونكتشف العالم معًا!</p>
</header>
<main>
<section class="panel" id="home">
<h2>أهلًا يا سيليا! 💗</h2>
<p>اختاري اللعبة التي تحبينها</p>
<div class="menu">
<button onclick="start('letters')">🔤 الحروف العربية</button>
<button onclick="start('numbers')">🔢 الأرقام والعدّ</button>
<button onclick="start('colors')">🎨 الألوان</button>
<button onclick="start('match')">🧩 المطابقة الذكية</button>
<button onclick="start('animals')">🐘 عالم الحيوانات</button>
<button onclick="start('transport')">🚗 وسائل النقل</button>
<button onclick="start('places')">🏛️ أماكن مصر الجميلة</button>
<button onclick="start('shapes')">⭐ الأشكال</button>
<button onclick="start('draw')">🖍️ مساحة الإبداع</button>
</div>
</section>

<section class="panel" id="game">
<button onclick="home()" style="float:right">⬅ القائمة</button>
<div style="clear:both"></div>
<h2 id="title"></h2>
<div id="question"></div>
<div id="choices"></div>
<div id="feedback" aria-live="polite"></div>
<p>⭐ النجوم: <b id="score">0</b></p>
<button class="primary" onclick="next()">السؤال التالي ➜</button>
</section>

<section class="panel" id="drawing" style="display:none">
<h2>🖍️ ارسمِي يا سيليا</h2>
<p>اختاري لونًا ثم ارسمِي بإصبعك أو بالماوس</p>
<div>
<button onclick="setColor('#ff70ad')">💗 وردي</button>
<button onclick="setColor('#438cf5')">💙 أزرق</button>
<button onclick="setColor('#39b978')">💚 أخضر</button>
<button onclick="setColor('#ffb52e')">💛 أصفر</button>
<button onclick="setColor('#382747')">✏️ أسود</button>
<button onclick="clearCanvas()">مسح الرسم</button>
</div>
<canvas id="canvas" width="600" height="350"
style="width:100%;height:auto;touch-action:none;border:2px dashed #e6cce0;border-radius:15px;margin-top:12px"></canvas>
<button onclick="saveDrawing()">حفظ الرسم</button>
</section>
<p class="small">لعبة تعليمية تجريبية للأطفال. يُفضّل اللعب بمشاركة أحد الوالدين.</p>
</main>

<script>
const letters=[
['أ','أسد'],['ب','بطة'],['ت','تفاحة'],['ث','ثعلب'],
['ج','جمل'],['ح','حصان'],['خ','خروف'],['د','دب'],
['ذ','ذئب'],['ر','رمان'],['ز','زهرة'],['س','سمكة'],
['ش','شمس'],['ص','صقر'],['ض','ضفدع'],['ط','طائرة'],
['ظ','ظبي'],['ع','عنب'],['غ','غزال'],['ف','فيل'],
['ق','قمر'],['ك','كلب'],['ل','ليمون'],['م','موز'],
['ن','نحلة'],['ه','هلال'],['و','وردة'],['ي','يد']
];
const data={
letters:{title:'🔤 الحروف العربية',items:letters.map(x=>[x[0],x[1]])},
numbers:{title:'🔢 الأرقام والعدّ',items:[
['١','واحد'],['٢','اثنان'],['٣','ثلاثة'],['٤','أربعة'],
['٥','خمسة'],['٦','ستة'],['٧','سبعة'],['٨','ثمانية'],
['٩','تسعة'],['١٠','عشرة']]},
colors:{title:'🎨 تعلّم الألوان',items:[
['🟥','أحمر'],['🟦','أزرق'],['🟨','أصفر'],['🟩','أخضر'],
['🟪','بنفسجي'],['🟧','برتقالي'],['⬛','أسود'],['⬜','أبيض']]},
animals:{title:'🐾 عالم الحيوانات',items:[
['🐱','قطة'],['🐶','كلب'],['🐘','فيل'],['🦁','أسد'],
['🐄','بقرة'],['🐪','جمل'],['🐟','سمكة'],['🐦','عصفور']]},
transport:{title:'🚗 وسائل النقل',items:[
['🚗','سيارة'],['🚌','حافلة'],['🚂','قطار'],['✈️','طائرة'],
['🚢','سفينة'],['🚲','دراجة'],['🚁','هليكوبتر'],['🚀','صاروخ']]},
places:{title:'🏛️ أماكن مصر الجميلة',items:[
['🔺','أهرامات الجيزة'],['🗿','أبو الهول'],
['🏛️','معبد الكرنك'],['🏰','قلعة صلاح الدين'],
['🏛️','مكتبة الإسكندرية'],['🌊','نهر النيل'],
['🏺','معبد أبو سمبل'],['🏖️','شواطئ مصر']]},
shapes:{title:'⭐ الأشكال',items:[
['🔴','دائرة'],['🟥','مربع'],['🔺','مثلث'],['⭐','نجمة'],
['❤️','قلب'],['⬭','بيضاوي']]}
};
let mode='',index=0,score=0,round=[];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(text){
 if(!('speechSynthesis' in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang='ar-EG';u.rate=.8;speechSynthesis.speak(u);
}
function start(m){
 mode=m;
 document.getElementById('home').style.display='none';
 document.getElementById('game').style.display=m==='draw'?'none':'block';
 document.getElementById('drawing').style.display=m==='draw'?'block':'none';
 if(m==='draw')return;
 round=shuffle(data[m].items);index=0;
 document.getElementById('title').textContent=data[m].title;
 next();
}
function next(){
 if(!mode||mode==='draw')return;
 const items=data[mode].items;
 if(index>=round.length){round=shuffle(items);index=0;}
 const item=round[index++];
 const distractors=shuffle(items.filter(x=>x[1]!==item[1])).slice(0,3);
 const opts=shuffle([item,...distractors]);
 document.getElementById('question').innerHTML=
 `<div class="big">${item[0]}</div><p>أين ${item[1]}؟</p>`;
 document.getElementById('choices').innerHTML='';
 document.getElementById('feedback').textContent='';
 opts.forEach(opt=>{
 const b=document.createElement('button');
 b.className='choice';
 b.textContent=mode==='letters'?opt[0]+' — '+opt[1]:opt[0]+' '+opt[1];
 b.onclick=()=>{
 const fb=document.getElementById('feedback');
 if(opt[1]===item[1]){
 fb.textContent='أحسنتِ يا سيليا! 🌟';
 score++;document.getElementById('score').textContent=score;
 speak('أحسنت يا سيليا! '+item[1]);
 [...document.querySelectorAll('.choice')].forEach(x=>x.disabled=true);
 }else{
 fb.textContent='حاولي مرة أخرى يا بطلة 💗';
 speak('حاولي مرة أخرى');
 }
 };
 document.getElementById('choices').appendChild(b);
 });
}
function home(){
 if('speechSynthesis' in window)speechSynthesis.cancel();
 mode='';
 document.getElementById('home').style.display='block';
 document.getElementById('game').style.display='none';
 document.getElementById('drawing').style.display='none';
}
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let ink='#ff70ad',painting=false;
ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';
function setColor(c){ink=c}
function point(e){
 const r=canvas.getBoundingClientRect();
 return {x:(e.clientX-r.left)*canvas.width/r.width,
 y:(e.clientY-r.top)*canvas.height/r.height};
}
canvas.addEventListener('pointerdown',e=>{
 painting=true;canvas.setPointerCapture(e.pointerId);
 const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);
});
canvas.addEventListener('pointermove',e=>{
 if(!painting)return;
 const p=point(e);ctx.strokeStyle=ink;ctx.lineTo(p.x,p.y);ctx.stroke();
});
canvas.addEventListener('pointerup',()=>painting=false);
canvas.addEventListener('pointercancel',()=>painting=false);
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height)}
function saveDrawing(){
 const a=document.createElement('a');
 a.download='Celia-drawing.png';a.href=canvas.toDataURL('image/png');a.click();
}
</script>
</body>
</html>
